# ============================================================
# Multi-account trading: run several Alpaca paper accounts, each
# with its own strategy, and compare which performs best.
# Put each account's keys in .env (see .env.example for the slots).
# ============================================================
[accounts]
# Comma-separated account ids; each needs an [account:<id>] section.
ids = alpha,beta,gamma

[account:alpha]
name = Alpha
# Env var names holding this account's Alpaca paper key/secret.
# 'alpha' reuses your existing keys, so it works immediately.
api_key_env = ALPACA_API_KEY
secret_key_env = ALPACA_SECRET_KEY
strategy = strat_alpha
enabled = true

[account:beta]
name = Beta
api_key_env = ALPACA_API_KEY_2
secret_key_env = ALPACA_SECRET_KEY_2
strategy = strat_beta
enabled = true

[account:gamma]
name = Gamma
api_key_env = ALPACA_API_KEY_3
secret_key_env = ALPACA_SECRET_KEY_3
strategy = strat_gamma
enabled = true

# ---- Strategy profiles ----
# Any key below OVERRIDES the matching base setting for that account
# (min_signal_strength, min_confirmations, risk_per_trade_pct, watchlist,
#  bar_interval, ml_enabled, mode, indicator/weight params, ...).
# Omit a key to inherit the base value. DEFINE YOUR STRATEGIES HERE — the
# values below are just distinct starting points to edit.
#
# CONTROLLED COMPARISON: none of the profiles below set `watchlist`, so all
# three inherit the same symbol list from [watchlist] and trade the same
# universe. This is deliberate — it keeps stock selection constant so a P&L
# gap between accounts is attributable to the strategy parameters themselves
# rather than to which symbols each one happened to hold. `risk_per_trade_pct`
# is identical across all three for the same reason. If you add a `watchlist`
# line to one profile, you reintroduce that confound and the leaderboard no
# longer isolates the strategy.
#
# The variables actually under test: signal threshold, confirmation count,
# bar interval, and (gamma) whether the ML filter is on at all.
[strategy:strat_alpha]
# Baseline: moderate threshold, fast bars, ML on.
min_signal_strength = 65
min_confirmations = 2
risk_per_trade_pct = 0.25
bar_interval = 5
ml_enabled = true

[strategy:strat_beta]
# Selective: higher bar to trade, more confirmations, slower bars.
min_signal_strength = 70
min_confirmations = 3
risk_per_trade_pct = 0.25
bar_interval = 15
ml_enabled = true

[strategy:strat_gamma]
# Permissive + ML off — the control arm that isolates the ML filter's value
# (identical to alpha apart from the looser threshold and ml_enabled).
min_signal_strength = 60
min_confirmations = 2
risk_per_trade_pct = 0.25
bar_interval = 5
ml_enabled = false

[trading]
# Trading mode: day, swing, or both
mode = both

# Maximum number of simultaneous positions
max_positions = 2

# Maximum percentage of portfolio per position
max_position_pct = 40.0

# Minimum cash reserve percentage (never go below this)
min_cash_reserve_pct = 10.0

# Only trade during market hours
market_hours_only = true

[day_trading]
# Day trading specific settings
# PDT rule: requires $25,000+ account balance
pdt_compliant = true

# Close all day trade positions before market close (minutes before close)
close_before_eod_minutes = 15

# Minimum volume for day trade candidates
min_volume = 500000

# Minimum price for day trade stocks
min_price = 1.0

# Maximum price for day trade stocks
# Was 50.0 when the account held ~$300; at $9k that silently excluded AMD (and
# any other higher-priced watchlist name) from day entries while still allowing
# them as swing entries. Raised so the day/swing universes stay consistent.
max_price = 500.0

[swing_trading]
# Swing trading specific settings
# Maximum hold period in days
max_hold_days = 14

# Minimum volume for swing trade candidates
min_volume = 200000

# Minimum price
min_price = 10.0

# Maximum price
max_price = 1000.0

[signals]
# Signal detection settings

# Minimum signal strength to trigger trade (0-100)
min_signal_strength = 65

# Number of confirmations required
min_confirmations = 2

# Signal weights (must sum to 100)
weight_rsi = 15
weight_macd = 20
weight_vwap = 15
weight_bollinger = 10
weight_ema_crossover = 15
weight_volume = 15
weight_atr = 10

[risk_management]
# Risk management settings

# Conservative starting risk framework (percent of account equity)
# Target risk sized per trade
risk_per_trade_pct = 0.25
# Hard ceiling on any single trade's risk
max_risk_per_trade_pct = 0.50
# Cap on summed risk across all open positions
max_combined_open_risk_pct = 1.0

# Maximum daily loss (dollars) — a flat backstop; the % limit below is the
# intended primary control and should bind first.
# NOTE: keep this ABOVE (max_daily_loss_pct% x equity) or it silently becomes
# the real limit. At $9k equity the % limit is $135, so 30.0 (the old ~$300
# account value) halted trading after ~1.3 losing trades at 0.25% risk.
# Revisit this line whenever account size changes materially.
max_daily_loss = 200.0

# Daily loss limit (percentage of equity)
max_daily_loss_pct = 1.5

# Weekly loss limit (percentage of equity)
max_weekly_loss_pct = 3.0

# Drawdown that flags the strategy for review (warn, keep trading)
review_drawdown_pct = 5.0

# Drawdown that triggers a full shutdown (trips the kill switch)
shutdown_drawdown_pct = 8.0

# Stop loss percentage from entry
default_stop_loss_pct = 2.0

# Take profit percentage from entry
default_take_profit_pct = 4.0

# Trailing stop activation (percentage profit)
trailing_stop_activation_pct = 2.0

# Trailing stop distance percentage
trailing_stop_distance_pct = 1.0

# Maximum consecutive losses before pause
max_consecutive_losses = 3

# Pause duration after max losses (minutes)
pause_duration_minutes = 60

# Risk/reward minimum ratio
min_risk_reward_ratio = 2.0

[indicators]
# Technical indicator parameters

# RSI
rsi_period = 14
rsi_overbought = 70
rsi_oversold = 30

# MACD
macd_fast = 12
macd_slow = 26
macd_signal = 9

# VWAP
vwap_use_anchored = false

# Bollinger Bands
bb_period = 20
bb_std_dev = 2.0

# EMA Crossovers
ema_fast = 9
ema_slow = 21
ema_trend = 50

# Volume
volume_sma_period = 20
volume_surge_multiplier = 2.0

# ATR (Average True Range)
atr_period = 14
atr_stop_multiplier = 2.0

[scanner]
# Stock scanner settings.
#
# SCOPE: the scanner is a RESEARCH tool for the dashboard's Scan Results panel.
# The bot does not use it — it iterates the watchlist directly and decides with
# the indicators + ML filter. Nothing here affects what gets traded.
#
# These four used to be absent, so the scanner silently fell back to hardcoded
# defaults (min_price 5.0, min_volume 500000 on the DAY's bar) that quietly
# excluded half the watchlist — NIO for being under $5, HOOD and AMD because
# their part-formed pre-market bars looked illiquid.

# Price band for a symbol to be considered at all.
min_price = 1.0
max_price = 1000.0

# Liquidity floor, measured on the 20-day AVERAGE daily volume — not on today's
# bar, which is partial for most of the trading day.
min_avg_volume = 500000

# Minimum opportunity score (0-100) for a symbol to appear in the results.
# Scores come from volume surge (<=30), price move (<=25), intraday range (<=15),
# volume confirming the move (15) and gaps (10). Lower this to see more.
min_score = 30

# Top N results to show
top_results = 20

# Scan interval in seconds. NOT USED — scanning is manual, via the Run Scan
# button. Kept because /api/components reports it on the Sections card.
scan_interval = 300

# Removed, because they were read but never applied — the scanner had no
# market-cap or sector data source, and exclude_penny_stocks duplicated
# min_price: min_market_cap, sectors, exclude_penny_stocks.

[watchlist]
# Default watchlist (comma-separated).
# This is the SHARED universe for the alpha/beta/gamma comparison — none of the
# [strategy:*] profiles override `watchlist`, so editing this line changes what
# all three accounts trade. That is intentional; see the note above the
# strategy profiles before making any one account's list differ.
symbols = F,PLTR,SOFI,NIO,RIVN,HOOD,SNAP,AMD,BAC,T

[correlation_groups]
# "One risk allocation per correlated group": the bot will not open a second
# position in any group below. Symbols not listed are each their own group.
# group_name = SYM1,SYM2,...
ev_auto = F,NIO,RIVN
fintech = SOFI,HOOD

[notifications]
# Notification settings

# Enable Discord notifications
discord_enabled = false

# Enable email notifications
email_enabled = false

# Notify on trade entry
notify_on_entry = true

# Notify on trade exit
notify_on_exit = true

# Notify on daily summary
notify_daily_summary = true

# Notify on errors/warnings
notify_on_error = true

[performance]
# Performance monitoring

# Log execution times
log_execution_times = true

# Performance report interval (minutes)
report_interval = 60

# Data bar interval for analysis (minutes)
bar_interval = 5
